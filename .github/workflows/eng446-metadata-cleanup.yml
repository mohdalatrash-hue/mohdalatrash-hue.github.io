name: ENG446 one-time metadata cleanup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove macOS sidecar files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch eng446/._final-week.css eng446/._final-week.js eng446/._week6.html eng446/._workshop-final-paper.html eng446/._workshop-final-paper-sunday.html eng446/._workshop-final-paper-monday.html eng446/._workshop-final-paper-tuesday.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove macOS metadata sidecars'
          git push
